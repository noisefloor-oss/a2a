name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Standard hosted ARM64 validation; external fork admission stays explicit.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Reject unadmitted external fork source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Import this change into a same-repository branch before CI certification." >&2
          exit 1
      - name: Check out source
        uses: actions/checkout@v4
      - name: Ensure PyNaCl on the runner interpreter
        run: |
          if ! python3 -c 'import nacl' 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends python3-nacl
          fi
          python3 -c 'import nacl; print("pynacl", nacl.__version__)'
      - name: Run the suite
        run: python3 -B -m unittest -v test_a2a.py

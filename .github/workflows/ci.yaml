name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Standard hosted ARM64 validation; external fork admission stays explicit.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Reject unadmitted external fork source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Import this change into a same-repository branch before CI certification." >&2
          exit 1
      - name: Check out source
        uses: actions/checkout@v4
      - name: Ensure PyNaCl on the runner interpreter
        run: |
          if ! python3 -c 'import nacl; assert nacl.__version__ == "1.6.2"' 2>/dev/null; then
            python3 -m venv "$RUNNER_TEMP/a2a-venv"
            "$RUNNER_TEMP/a2a-venv/bin/python" -m pip install --no-cache-dir pynacl==1.6.2
            echo "$RUNNER_TEMP/a2a-venv/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/a2a-venv/bin:$PATH"
          fi
          python3 -c 'import nacl; assert nacl.__version__ == "1.6.2"; print("pynacl", nacl.__version__)'
      - name: Run the suite
        run: python3 -B -m unittest -v test_a2a.py

name: Benchmarks

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # Isolated hosted ARM64 benchmark VM. Schedule and dispatch only;
    # benchmark thresholds and artifacts remain unchanged.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Ensure PyNaCl on the runner interpreter
        run: |
          if ! python3 -c 'import nacl; assert nacl.__version__ == "1.6.2"' 2>/dev/null; then
            python3 -m venv "$RUNNER_TEMP/a2a-venv"
            "$RUNNER_TEMP/a2a-venv/bin/python" -m pip install --no-cache-dir pynacl==1.6.2
            echo "$RUNNER_TEMP/a2a-venv/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/a2a-venv/bin:$PATH"
          fi
          python3 -c 'import nacl; assert nacl.__version__ == "1.6.2"; print("pynacl", nacl.__version__)'
      # Timing assertions run on a quiet scheduled runner, not per pull
      # request; the deterministic page-count expectations live in bench.py
      # either way, and --json keeps the numbers as an artifact.
      - name: Run the benchmark suite
        run: python3 -B bench.py --json > benchmarks.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmarks
          path: benchmarks.json
